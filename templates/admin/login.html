<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Damanola Admin Login</title><style>
body{margin:0;background:#090909;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh}.box{width:min(390px,88%);background:#151515;padding:30px;border:1px solid #333;border-radius:10px}h1{color:#f2b400}input,button{width:100%;padding:13px;margin-top:10px;box-sizing:border-box;border-radius:5px;border:1px solid #444;background:#080808;color:#fff}button{background:#f2b400;color:#000;font-weight:bold;cursor:pointer}.back{display:block;margin-top:18px;color:#aaa;text-align:center}</style></head>
<body><div class="box"><h1>DAMANOLA ADMIN</h1><p>Sign in to manage quote requests and services.</p>{% with messages=get_flashed_messages() %}{% if messages %}<p style="color:#ff8d8d">{{messages[-1]}}</p>{% endif %}{% endwith %}<form method="post"><input type="password" name="password" placeholder="Admin password" required><button>LOGIN</button></form><a class="back" href="/">← Back to website</a></div></body></html>
